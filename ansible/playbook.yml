---
# Common baseline on every managed node
- name: Baseline configuration
  hosts: all
  become: true
  tags: [baseline]
  roles:
    - git
    - java
    - docker
    - k8s-prereqs

- name: Configure app nodes
  hosts: role_app
  become: true
  tags: [app]
  roles:
    - nginx
    - app-deploy

- name: Configure Jenkins agent nodes
  hosts: role_jenkins_agent
  become: true
  tags: [jenkins-agent]
  roles:
    - jenkins-agent